<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Угадай слово</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      color: #333;
    }
    .header {
      background: #00bcd4;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 16px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #4caf50;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
    }
    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    .hint {
      background: #f5f5f5;
      padding: 10px;
      border-left: 4px solid #9c27b0;
      margin: 8px 0;
      border-radius: 0 4px 4px 0;
    }
    .message {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .success { background: #c8e6c9; color: #2e7d32; }
    .error { background: #ffcdd2; color: #c62828; }
    .info { background: #bbdefb; color: #0d47a1; }
    .attempts {
      text-align: center;
      font-weight: bold;
      color: #ff9800;
    }
    #restart {
      background: #2196f3;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="header">УГ
